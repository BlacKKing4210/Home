<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9DE8B"/>
      <stop offset="1" stop-color="#7FC86D"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3A0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F4C14E" stop-opacity=".15"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FFF9E8"/>
    </marker>
  </defs>
  <rect width="1440" height="1280" fill="#183E42"/>
  <text x="72" y="76" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFF9E8">F003-VQ.1 可编辑样式帧 · 农田采收因果链</text>
  <text x="72" y="116" font-family="sans-serif" font-size="20" fill="#CFEDEE">DRAFT / 待附加到 Figma；不改变现有 HUD 和命中区</text>

  <g id="runtime-frame" transform="translate(72 160)">
    <rect x="0" y="0" width="720" height="1040" rx="28" fill="url(#grass)" stroke="#FFF9E8" stroke-width="4"/>
    <path d="M0 742 C180 680 356 734 720 930" fill="none" stroke="#C39B64" stroke-width="94"/>
    <path d="M0 742 C180 680 356 734 720 930" fill="none" stroke="#E8C98F" stroke-width="70"/>

    <g id="ready-field" transform="translate(270 440)">
      <ellipse cx="0" cy="30" rx="112" ry="38" fill="#24434C" opacity=".2" filter="url(#softShadow)"/>
      <path d="M0 -88 L132 0 L0 88 L-132 0 Z" fill="#86482F"/>
      <path d="M0 -72 L110 0 L0 72 L-110 0 Z" fill="#B96F42"/>
      <ellipse cx="0" cy="0" rx="142" ry="100" fill="none" stroke="#F4C14E" stroke-width="12"/>
      <ellipse cx="0" cy="0" rx="126" ry="86" fill="url(#goldGlow)"/>
      <g fill="#E4A82E" stroke="#24434C" stroke-width="5">
        <path d="M-70 38 C-72 -8 -48 -64 -30 -76 C-18 -34 -26 14 -20 50 Z"/>
        <path d="M-20 48 C-26 -18 0 -84 22 -98 C38 -42 22 12 34 54 Z"/>
        <path d="M34 42 C30 -8 62 -64 82 -70 C92 -18 76 20 82 52 Z"/>
      </g>
      <circle cx="112" cy="-82" r="34" fill="#159A8C" stroke="#FFF" stroke-width="7"/>
      <path d="M97 -82 L107 -70 L128 -94" fill="none" stroke="#FFF" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g id="granary-target" transform="translate(590 144)">
      <ellipse cx="0" cy="66" rx="80" ry="24" fill="#24434C" opacity=".22"/>
      <path d="M-68 60 L-68 -8 L0 -64 L68 -8 L68 60 Z" fill="#B96F42" stroke="#FFF9E8" stroke-width="8"/>
      <path d="M-78 -6 L0 -80 L78 -6" fill="#0B6D69" stroke="#FFF9E8" stroke-width="10"/>
      <rect x="-20" y="15" width="40" height="45" fill="#F4E4BE" stroke="#24434C" stroke-width="5"/>
      <circle cx="70" cy="-48" r="30" fill="#159A8C" stroke="#FFF" stroke-width="7"/>
      <text x="70" y="-39" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#FFF">+3</text>
    </g>

    <path id="harvest-arc" d="M296 420 Q430 190 568 180" fill="none" stroke="#FFF9E8" stroke-width="8" stroke-dasharray="16 14" marker-end="url(#arrow)"/>
    <g fill="#F4C14E" stroke="#24434C" stroke-width="3">
      <circle cx="345" cy="334" r="13"/>
      <path d="M408 266 Q425 244 443 262 Q425 282 408 266 Z"/>
      <circle cx="488" cy="210" r="11"/>
    </g>

    <g id="layer-notes" font-family="sans-serif">
      <rect x="34" y="38" width="280" height="104" rx="18" fill="#24434C" opacity=".88"/>
      <text x="58" y="76" font-size="22" font-weight="700" fill="#FFF9E8">P0：成熟田地</text>
      <text x="58" y="108" font-size="18" fill="#CFEDEE">暖金外环 + 完整剪影 + 状态徽标</text>
      <rect x="372" y="810" width="308" height="142" rx="18" fill="#24434C" opacity=".88"/>
      <text x="398" y="850" font-size="22" font-weight="700" fill="#FFF9E8">因果必须在世界内闭环</text>
      <text x="398" y="884" font-size="18" fill="#CFEDEE">作物离田 → 弧线轨迹 → 粮仓确认</text>
      <text x="398" y="918" font-size="18" fill="#CFEDEE">减少动态时改为起点/终点静态高亮</text>
    </g>
  </g>

  <g id="contract-panel" transform="translate(850 174)" font-family="sans-serif">
    <text x="0" y="0" font-size="28" font-weight="700" fill="#FFF9E8">运行时分层</text>
    <g transform="translate(0 34)">
      <rect width="500" height="72" rx="14" fill="#65A85F"/><text x="24" y="45" font-size="22" fill="#FFF">1  Ground：低对比草地与菱形纹理</text>
      <rect y="86" width="500" height="72" rx="14" fill="#C39B64"/><text x="24" y="131" font-size="22" fill="#24434C">2  Path / Water：道路与边界</text>
      <rect y="172" width="500" height="72" rx="14" fill="#B96F42"/><text x="24" y="217" font-size="22" fill="#FFF">3  World Entities：田块、建筑、动物</text>
      <rect y="258" width="500" height="72" rx="14" fill="#F4C14E"/><text x="24" y="303" font-size="22" fill="#24434C">4  World State：成熟、计时、锁定</text>
      <rect y="344" width="500" height="72" rx="14" fill="#159A8C"/><text x="24" y="389" font-size="22" fill="#FFF">5  Feedback：纯视觉、无输入、可清理</text>
      <rect y="430" width="500" height="72" rx="14" fill="#FFF9E8"/><text x="24" y="475" font-size="22" fill="#24434C">6  HUD：保持现有构图与动态文本</text>
    </g>

    <text x="0" y="612" font-size="28" font-weight="700" fill="#FFF9E8">状态对照</text>
    <g transform="translate(0 646)">
      <rect width="500" height="98" rx="14" fill="#24434C" stroke="#F4C14E" stroke-width="4"/>
      <text x="24" y="39" font-size="22" font-weight="700" fill="#F4C14E">成功</text>
      <text x="24" y="72" font-size="19" fill="#FFF9E8">0.72s；6 粒子；终点 +产量；模型成功后播放</text>
      <rect y="114" width="500" height="98" rx="14" fill="#24434C" stroke="#DA654C" stroke-width="4"/>
      <text x="24" y="153" font-size="22" font-weight="700" fill="#FF9D8A">阻塞</text>
      <text x="24" y="186" font-size="19" fill="#FFF9E8">成熟作物保留；无成功飞行；起点与容量区警示</text>
      <rect y="228" width="500" height="98" rx="14" fill="#24434C" stroke="#CFEDEE" stroke-width="4"/>
      <text x="24" y="267" font-size="22" font-weight="700" fill="#CFEDEE">减少动态效果</text>
      <text x="24" y="300" font-size="19" fill="#FFF9E8">0.34s 静态起点/终点高亮；语义和结算不变</text>
    </g>

    <text x="0" y="1022" font-size="22" fill="#CFEDEE">运行素材：只使用项目已晋级资产 + 程序化基本形状</text>
    <text x="0" y="1058" font-size="22" fill="#CFEDEE">Figma：新样式帧附件 Pending；物质性 UI 改版禁止</text>
  </g>
</svg>

